name: Sync to Gitee Pages (国内镜像)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  HUGO_VERSION: "0.158.0"
  TZ: Asia/Shanghai

jobs:
  build-and-deploy:
    name: Build & Deploy to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Build
        run: |
          hugo --gc --minify

      - name: Deploy to Gitee Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITEE_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          external_repo: ${{ secrets.GITEE_USERNAME }}/${{ secrets.GITEE_REPO }}
          cname: ${{ secrets.GITEE_CNAME }}
