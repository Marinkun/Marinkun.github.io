name: Sync to Gitee Pages (国内镜像)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  HUGO_VERSION: "0.158.0"
  TZ: Asia/Shanghai

jobs:
  build-and-deploy:
    name: Build & Deploy to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Build
        run: |
          hugo --gc --minify

      - name: Deploy to Gitee Pages
        run: |
          cd public
          git init
          git config user.name "${{ secrets.GITEE_USERNAME }}"
          git config user.email "${{ secrets.GITEE_EMAIL }}"
          git remote add origin "https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/${{ secrets.GITEE_REPO }}.git"
          git add .
          git commit -m "Deploy from GitHub Actions at $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push -f origin master
